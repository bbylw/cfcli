name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://cfcli.ndjp.net

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          # 跟随 1.x：拿到补丁与安全修复，同时挡住 bun 2.x 的破坏性变更
          bun-version: 1.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check, lint, test and build
        run: bun run verify

      - name: Ensure CNAME survived the build
        run: test "$(cat dist/CNAME)" = "cfcli.ndjp.net"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
